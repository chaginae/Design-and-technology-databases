{% extends "core/base.html" %}
{% block title %}Регистрация{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h4 class="text-center mb-3">Регистрация сотрудника</h4>

        <div class="card shadow-sm">
            <div class="card-body">
                {% if errors %}
                <div class="alert alert-danger" role="alert">
                    {% for error in errors %}{{ error }}{% if not forloop.last %}<br>{% endif %}{% endfor %}
                </div>
                {% endif %}
                <form method="post">
                    {% csrf_token %}

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Имя</label>
                            <input class="form-control" name="first_name">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Фамилия</label>
                            <input class="form-control" name="last_name">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Логин</label>
                        <input class="form-control" name="username">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Пароль</label>
                        <input type="password" class="form-control" name="password">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Подтверждение пароля</label>
                        <input type="password" class="form-control" name="password_confirm">
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Дата рождения</label>
                            <input class="form-control" name="date_of_birth" placeholder="ДД.ММ.ГГГГ">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Пол</label>
                            <select class="form-select" name="gender">
                                <option value="">— выберите —</option>
                                {% for choice in gender_choices %}
                                <option value="{{ choice }}">{{ choice }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <hr class="my-4">

                    <div class="mb-3">
                        <label class="form-label">Должность</label>
                        <input class="form-control" name="position">
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Подразделение</label>
                        <input class="form-control" name="department">
                    </div>

                    <button class="btn btn-success w-100">
                        Зарегистрировать
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
